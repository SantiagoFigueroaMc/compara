<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compara</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧶</text></svg>">
    <style>
        :root {
            font-family: system-ui, sans-serif;
            color: #222;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --border: #d1d5db;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #f7f7f7;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .cards-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .cards-container > .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 8px;
        }

        .object-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex: 1;
        }

        .filter-input {
            width: min(320px, 100%);
            min-width: 0;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font: inherit;
        }

        .filter-input:focus {
            border-color: var(--primary);
            outline: 3px solid rgb(37 99 235 / 20%);
        }

        .mini-card {
            position: relative;
            width: 180px;
            height: 210px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: white;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .mini-card__name {
            display: block;
            min-height: 2.5em;
            margin-bottom: 8px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .mini-card__content {
            flex: 1;
            min-height: 0;
            margin: 0;
            overflow: auto;
            white-space: pre-wrap;
            font-size: 0.8em;
            color: #555;
        }

        .mini-card__actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-shrink: 0;
        }

        button {
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            color: #374151;
            cursor: pointer;
            font: inherit;
            font-size: 0.875rem;
            line-height: 1.25rem;
            padding: 7px 11px;
            transition: background-color 150ms ease, border-color 150ms ease,
                box-shadow 150ms ease, color 150ms ease, transform 150ms ease;
        }

        button:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        button:active {
            transform: translateY(1px);
        }

        button:focus-visible {
            outline: 3px solid rgb(37 99 235 / 30%);
            outline-offset: 2px;
        }

        #open-object-dialog,
        #save-object {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
            font-weight: 600;
        }

        #open-object-dialog:hover,
        #save-object:hover {
            border-color: var(--primary-hover);
            background: var(--primary-hover);
        }

        .mini-card__actions button:last-child {
            color: var(--danger);
        }

        .mini-card__actions button:last-child:hover {
            border-color: var(--danger);
            background: #fef2f2;
            color: var(--danger-hover);
        }

        .empty-state {
            width: 100%;
            color: #666;
        }

        #objects-list {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 2px 12px;
            width: 100%;
        }

        .mini-card[draggable="true"] {
            flex: 0 0 180px;
            cursor: grab;
        }

        .mini-card[draggable="true"]:active {
            cursor: grabbing;
        }

        .comparison-section {
            max-width: 900px;
            margin: 28px auto 0;
        }

        .comparison-section h2 {
            margin-bottom: 10px;
        }

        .comparison-header {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .comparison-header h2 {
            margin: 0;
            margin-right: auto;
        }

        .set-name-input {
            width: 190px;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font: inherit;
        }

        .set-selector {
            min-width: 170px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            padding: 8px 10px;
            font: inherit;
        }

        .comparison-dropzone {
            min-height: 90px;
            overflow-x: auto;
            border: 2px dashed var(--border);
            border-radius: 8px;
            background: #fff;
        }

        .comparison-layout {
            display: grid;
            grid-template-columns: 190px minmax(0, 1fr);
            gap: 12px;
            align-items: start;
        }

        .comparison-key-selector {
            min-height: 90px;
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            padding: 12px;
            box-sizing: border-box;
        }

        .comparison-key-selector h3 {
            margin: 0 0 10px;
            font-size: 0.95rem;
        }

        .key-selector__option {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 8px 0;
            overflow-wrap: anywhere;
            font-size: 0.9rem;
        }

        .key-selector-empty {
            margin: 0;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .comparison-dropzone.is-dragging-over {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 520px;
        }

        .comparison-table th,
        .comparison-table td {
            border-bottom: 1px solid #e5e7eb;
            padding: 10px 12px;
            text-align: left;
            vertical-align: top;
        }

        .comparison-table th {
            background: #f3f4f6;
            font-weight: 600;
        }

        .comparison-table th:first-child {
            width: 180px;
        }

        .comparison-table code {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .remove-comparison {
            margin-left: 8px;
            padding: 2px 6px;
            color: var(--danger);
            font-size: 0.8rem;
        }

        .dropzone-empty {
            margin: 0;
            padding: 28px 16px;
            color: #6b7280;
            text-align: center;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        dialog {
            width: min(520px, calc(100% - 32px));
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
        }

        dialog::backdrop {
            background: rgb(0 0 0 / 40%);
        }

        .form-field {
            display: block;
            margin: 16px 0;
        }

        .form-field input,
        .form-field textarea {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            padding: 8px;
        }

        .content-field {
            position: relative;
        }

        .format-json-button {
            margin-top: 8px;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .icon-button {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
        }

        @media (max-width: 600px) {
            .cards-container > .header {
                align-items: stretch;
                flex-direction: column;
            }

            .object-controls {
                justify-content: stretch;
            }

            .filter-input {
                flex: 1;
            }

            .comparison-layout {
                grid-template-columns: 1fr;
            }
        }

        .icon {
            width: 1rem;
            height: 1rem;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
        }
    </style>
</head>
<body>
    <div class="cards-container">
        <div class="header">
            <h2>Available objects</h2>
            <div class="object-controls">
                <input id="object-filter" class="filter-input" type="search" placeholder="Filter by name, key or value" aria-label="Filter objects">
                <button id="open-object-dialog" class="icon-button" type="button">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    <span>Add</span>
                </button>
            </div>
        </div>
        <div id="objects-list" aria-live="polite"></div>
    </div>
    <section class="comparison-section" aria-labelledby="comparison-title">
        <div class="comparison-header">
            <h2 id="comparison-title">Object comparison</h2>
            <input id="comparison-set-name" class="set-name-input" type="text" maxlength="80" placeholder="Comparison set name" aria-label="Comparison set name">
            <button id="save-comparison-set" type="button">Save set</button>
            <select id="comparison-set-selector" class="set-selector" aria-label="Load comparison set">
                <option value="">Load saved set</option>
            </select>
        </div>
        <div class="comparison-layout">
            <aside id="comparison-key-selector" class="comparison-key-selector" aria-label="Keys to show">
                <p class="key-selector-empty">No keys available.</p>
            </aside>
            <div id="comparison-dropzone" class="comparison-dropzone">
                <p class="dropzone-empty">Drag objects here to compare them.</p>
            </div>
        </div>
    </section>
    <dialog id="edit-object">
        <form id="object-form">
            <div class="header">
                <h2 id="dialog-title">Add object</h2>
                <button id="close-btn" type="button" aria-label="Close dialog">&times;</button>
            </div>
            <label class="form-field">
                Name
                <input type="text" name="object-name" id="object-name" maxlength="100" placeholder="Object name (optional)">
            </label>
            <label class="form-field">
                Content (valid JSON)
                <textarea name="object-content" id="object-content" required placeholder='{"key": "value"}' rows="9"></textarea>
                <button id="format-json" class="format-json-button" type="button">Format JSON</button>
            </label>
            <div class="dialog-actions">
                <button id="cancel-object" type="button">Cancel</button>
                <button id="save-object" type="submit">Save</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="main.js"></script>
</body>
</html>

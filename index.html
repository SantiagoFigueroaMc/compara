<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compara</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧶</text></svg>">
    <style>
        :root {
            font-family: system-ui, sans-serif;
            color: #222;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --border: #d1d5db;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #f7f7f7;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-start;
            max-width: 900px;
            margin: 0 auto;
        }

        .cards-container > .header {
            margin-bottom: 8px;
        }

        .mini-card {
            position: relative;
            width: 180px;
            min-height: 120px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: white;
            padding: 12px;
            box-sizing: border-box;
        }

        .mini-card__name {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .mini-card__content {
            margin: 0;
            max-height: 72px;
            overflow: auto;
            white-space: pre-wrap;
            font-size: 0.8em;
            color: #555;
        }

        .mini-card__actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        button {
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            color: #374151;
            cursor: pointer;
            font: inherit;
            font-size: 0.875rem;
            line-height: 1.25rem;
            padding: 7px 11px;
            transition: background-color 150ms ease, border-color 150ms ease,
                box-shadow 150ms ease, color 150ms ease, transform 150ms ease;
        }

        button:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        button:active {
            transform: translateY(1px);
        }

        button:focus-visible {
            outline: 3px solid rgb(37 99 235 / 30%);
            outline-offset: 2px;
        }

        #open-object-dialog,
        #save-object {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
            font-weight: 600;
        }

        #open-object-dialog:hover,
        #save-object:hover {
            border-color: var(--primary-hover);
            background: var(--primary-hover);
        }

        .mini-card__actions button:last-child {
            color: var(--danger);
        }

        .mini-card__actions button:last-child:hover {
            border-color: var(--danger);
            background: #fef2f2;
            color: var(--danger-hover);
        }

        .empty-state {
            width: 100%;
            color: #666;
        }

        #objects-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
        }

        dialog {
            width: min(520px, calc(100% - 32px));
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
        }

        dialog::backdrop {
            background: rgb(0 0 0 / 40%);
        }

        .form-field {
            display: block;
            margin: 16px 0;
        }

        .form-field input,
        .form-field textarea {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            padding: 8px;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .icon-button {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
        }

        .icon {
            width: 1rem;
            height: 1rem;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
        }
    </style>
</head>
<body>
    <div class="cards-container">
        <div class="header">
            <h2>Available objects</h2>
            <button id="open-object-dialog" class="icon-button" type="button">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                <span>Add</span>
            </button>
        </div>
        <div id="objects-list" aria-live="polite"></div>
    </div>
    <dialog id="edit-object">
        <form id="object-form">
            <div class="header">
                <h2 id="dialog-title">Add object</h2>
                <button id="close-btn" type="button" aria-label="Close dialog">&times;</button>
            </div>
            <label class="form-field">
                Name
                <input type="text" name="object-name" id="object-name" required maxlength="100" placeholder="Object name">
            </label>
            <label class="form-field">
                Content (valid JSON)
                <textarea name="object-content" id="object-content" required placeholder='{"key": "value"}' rows="9"></textarea>
            </label>
            <div class="dialog-actions">
                <button id="cancel-object" type="button">Cancel</button>
                <button id="save-object" type="submit">Save</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compara</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧶</text></svg>">
    <style>
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 20px;
        }
        .mini-card {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            border: 1px solid #ccc;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }
    </style>
    </style>
</head>
<body>
    <div class="cards-container">
        <div class="header">
            <h2>Available objects</h2>
            <button id="open-object-dialog">Add</button>
        </div>
        <div class="mini-card">
            <span contenteditable="false" style="font-size: 0.8em; margin-bottom: 4px;">Item Name</span>
            <button title="Edit" style="background: none; border: none; font-size: 12px;">✎</button>
            <div class="miniature">
                <!-- Object icon or thumbnail -->
            </div>
        </div>
    </div>
    <!-- Dialog modal in the center of the screen with space to write a large json, if to large with overflow in the textarea tag. Close with click outside -->
    <dialog name="edit-object">
        <div class="header" style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0;">Edit Object</h2>
            <button id="close-btn" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>
        <input type="text" name="object-name" id="object-name" placeholder="Nombre del objeto">
        <textarea name="object-content" id="object-content" placeholder="Escribe o pega un objeto aquí..." style="width: 100%; height: 200px; resize: vertical;"></textarea>
        <button id="save-object">Save</button>
    </dialog>

    <script type="module" src="main.js"></script>
</body>
</html>
